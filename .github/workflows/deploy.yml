name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24: Vitest 4's rolldown native binding requires a newer Node
          # than 20 (on 20, npm skips the native optional dep and falls back to
          # the wasm binding, which cannot spawn test workers in CI).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catalog is committed (src/data/*.json) and is the source of truth. We do
      # NOT re-seed in CI: the Jikan API is flaky (frequent 504s) and seeding at
      # deploy time makes builds nondeterministic. Refresh the catalog locally
      # with `npm run seed` and commit the result.

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
